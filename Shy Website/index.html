<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>The Website Is Shy</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      height: 100vh;
      overflow: hidden;
      background: #fafafa;
      font-family: Arial, sans-serif;
      cursor: default;
    }

    .back {
      position: fixed;
      top: 25px;
      left: 30px;
      color: #aaa;
      text-decoration: none;
      font-size: 13px;
      z-index: 100;
    }

    #character {
      position: absolute;
      left: 50%;
      top: 50%;
      transform: translate(-50%, -50%);
      transition:
        left 0.45s ease,
        top 0.45s ease,
        opacity 0.6s ease;
      text-align: center;
      user-select: none;
    }

    #face {
      font-size: 55px;
      margin-bottom: 15px;
      transition: all 0.3s ease;
    }

    #message {
      font-size: 18px;
      color: #222;
      white-space: nowrap;
    }

    #trustContainer {
      position: fixed;
      bottom: 30px;
      left: 50%;
      transform: translateX(-50%);
      width: 250px;
      opacity: 0;
      transition: opacity 1s ease;
    }

    #trustLabel {
      font-size: 11px;
      letter-spacing: 2px;
      margin-bottom: 8px;
      text-align: center;
      color: #999;
    }

    #trustBar {
      width: 100%;
      height: 5px;
      background: #ddd;
    }

    #trustFill {
      height: 100%;
      width: 0%;
      background: #222;
      transition: width 0.5s ease;
    }

    #finalMessage {
      display: none;
      position: fixed;
      inset: 0;
      background: #111;
      color: white;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      text-align: center;
      z-index: 50;
    }

    #finalMessage h1 {
      font-size: 55px;
      font-weight: normal;
      margin-bottom: 15px;
    }

    #finalMessage p {
      color: #aaa;
      font-size: 17px;
    }

    .hint {
      position: fixed;
      right: 25px;
      bottom: 20px;
      color: #ccc;
      font-size: 11px;
    }
  </style>
</head>

<body>

<a class="back" href="../">← leave quietly</a>

<div id="character">
  <div id="face">•_•</div>
  <div id="message">hi.</div>
</div>

<div id="trustContainer">
  <div id="trustLabel">TRUST</div>

  <div id="trustBar">
    <div id="trustFill"></div>
  </div>
</div>

<div class="hint" id="hint">
  maybe don't scare it
</div>

<div id="finalMessage">
  <h1>okay.</h1>
  <p>i think i trust you now.</p>
</div>


<script>

  const character = document.getElementById("character");
  const face = document.getElementById("face");
  const message = document.getElementById("message");

  const trustContainer =
    document.getElementById("trustContainer");

  const trustFill =
    document.getElementById("trustFill");

  const finalMessage =
    document.getElementById("finalMessage");


  let trust = 0;

  let lastMouseX = 0;
  let lastMouseY = 0;
  let lastMoveTime = Date.now();

  let idleTimer;

  let scaredCount = 0;


  // SHOW TRUST BAR AFTER A MOMENT

  setTimeout(function() {
    trustContainer.style.opacity = "1";
  }, 2500);


  document.addEventListener("mousemove", function(event) {

    clearTimeout(idleTimer);

    const now = Date.now();

    const timeDifference =
      Math.max(now - lastMoveTime, 1);


    const movementDistance = Math.sqrt(
      Math.pow(event.clientX - lastMouseX, 2) +
      Math.pow(event.clientY - lastMouseY, 2)
    );


    const speed =
      movementDistance / timeDifference;


    lastMouseX = event.clientX;
    lastMouseY = event.clientY;
    lastMoveTime = now;


    const rect =
      character.getBoundingClientRect();


    const characterX =
      rect.left + rect.width / 2;

    const characterY =
      rect.top + rect.height / 2;


    const distance = Math.sqrt(
      Math.pow(event.clientX - characterX, 2) +
      Math.pow(event.clientY - characterY, 2)
    );


    // USER APPROACHES TOO FAST

    if (distance < 170 && speed > 0.7) {

      runAway();

      scaredCount++;

      trust = Math.max(0, trust - 5);

      updateTrust();


      if (scaredCount === 1) {
        message.innerText = "oh.";
        face.innerText = "•﹏•";
      }

      else if (scaredCount === 2) {
        message.innerText = "you're very close.";
        face.innerText = "⊙﹏⊙";
      }

      else if (scaredCount === 3) {
        message.innerText = "please stop chasing me.";
        face.innerText = "⊙_⊙";
      }

      else {
        message.innerText = "!!!";
        face.innerText = ">﹏<";
      }

    }


    // USER MOVES GENTLY NEAR CHARACTER

    if (
      distance < 230 &&
      distance > 100 &&
      speed < 0.25
    ) {

      trust += 0.25;

      if (trust > 100) {
        trust = 100;
      }

      updateTrust();


      if (trust > 20 && trust < 45) {
        message.innerText = "that's better.";
        face.innerText = "•ᴗ•";
      }

      if (trust >= 45 && trust < 70) {
        message.innerText = "you can stay.";
        face.innerText = "◕‿◕";
      }

      if (trust >= 70) {
        message.innerText = "i like you.";
        face.innerText = "˶ᵔ ᵕ ᵔ˶";
      }

    }


    // IF USER STOPS MOVING

    idleTimer = setTimeout(function() {

      trust += 8;

      if (trust > 100) {
        trust = 100;
      }

      updateTrust();

      returnToCenter();

    }, 3000);

  });


  function runAway() {

    const padding = 120;

    const newX =
      padding +
      Math.random() *
      (window.innerWidth - padding * 2);

    const newY =
      padding +
      Math.random() *
      (window.innerHeight - padding * 2);


    character.style.left = newX + "px";
    character.style.top = newY + "px";

  }


  function returnToCenter() {

    character.style.left = "50%";
    character.style.top = "50%";

    face.innerText = "•ᴗ•";

    if (trust < 30) {
      message.innerText = "...are you still there?";
    }

    else if (trust < 60) {
      message.innerText = "thanks for waiting.";
    }

    else {
      message.innerText = "come a little closer.";
    }

  }


  function updateTrust() {

    trustFill.style.width = trust + "%";


    if (trust >= 100) {

      setTimeout(function() {

        finalMessage.style.display = "flex";

      }, 500);

    }

  }


  // INITIAL NERVOUS MESSAGE

  setTimeout(function() {

    if (scaredCount === 0) {
      message.innerText = "don't move too fast.";
    }

  }, 4000);

</script>

</body>
</html>
